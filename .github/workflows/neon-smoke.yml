name: Neon deployment smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deployment-test/**'
      - '.github/workflows/neon-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python deployment-test/check.py
